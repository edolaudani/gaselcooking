<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GASEL Cooking | Authentic Italian Cooking Masterclass</title>

    <meta
        name="description"
        content="Authentic Italian cooking masterclasses in Luxembourg. Handmade pasta, Italian recipes and hands-on cooking experiences at home."
    >

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <div class="container header-inner">

            <!-- Logo -->
            <a href="/" class="site-logo" aria-label="GASEL Cooking home">
                <span class="logo-main">GASEL</span>
                <span class="logo-sub">COOKING</span>
            </a>


            <!-- Desktop Navigation -->
            <nav class="main-nav" aria-label="Main navigation">

                <a href="/" class="nav-link active">
                    Home
                </a>

                <a href="/masterclass/" class="nav-link">
                    Masterclass
                </a>

                <a href="/events/" class="nav-link">
                    Events
                </a>

                <a href="/gift-vouchers/" class="nav-link">
                    Gift Vouchers
                </a>

                <a href="/about/" class="nav-link">
                    About
                </a>

                <a href="/faq/" class="nav-link">
                    FAQ
                </a>

            </nav>


            <!-- Header CTA -->
            <a href="/masterclass/" class="header-cta">
                Book a Class
            </a>


            <!-- Mobile Menu Button -->
            <button
                class="menu-toggle"
                type="button"
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="mobile-menu"
            >
                <span></span>
                <span></span>
            </button>

        </div>


        <!-- Mobile Navigation -->
        <div class="mobile-menu" id="mobile-menu">

            <nav aria-label="Mobile navigation">

                <a href="/" class="mobile-nav-link">
                    Home
                </a>

                <a href="/masterclass/" class="mobile-nav-link">
                    Masterclass
                </a>

                <a href="/events/" class="mobile-nav-link">
                    Events
                </a>

                <a href="/gift-vouchers/" class="mobile-nav-link">
                    Gift Vouchers
                </a>

                <a href="/about/" class="mobile-nav-link">
                    About
                </a>

                <a href="/faq/" class="mobile-nav-link">
                    FAQ
                </a>

                <a href="/masterclass/" class="mobile-menu-cta">
                    Book a Class
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         TEMPORARY CONTENT
         ===================================================== -->

    <main>
    
      <!-- HERO -->
      <section class="hero">
        <div class="hero-image">
          <img
            src="/assets/images/hero/hero-main.jpg"
            alt="Handmade Italian pasta being prepared at home"
          >
        </div>
    
        <div class="hero-overlay"></div>
    
        <div class="container hero-content">
          <div class="hero-text">
            <span class="eyebrow">GASEL COOKING</span>
    
            <h1>
              Authentic Italian<br>
              Cooking Masterclass
            </h1>
    
            <p>
              Learn to cook Italian dishes from scratch,
              right in your own kitchen.
            </p>
    
            <a href="/masterclass/" class="btn btn-primary">
              Book a Class
            </a>
          </div>
        </div>
      </section>
    
    </main>


    <script src="assets/js/main.js"></script>

</body>
</html>
